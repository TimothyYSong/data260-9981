services:
  redis-search:
    image: redis/redis-stack-server:7.4.0-v8
    container_name: s9981-redis-search
    ports:
      - "127.0.0.1:6380:6379"
    restart: unless-stopped
  kafka:
    image: apache/kafka:3.9.1
    container_name: s9981-kafka
    hostname: kafka
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.hw08
    container_name: s9981-worker
    command: python kafka_inspection_worker.py
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    depends_on:
      - kafka
    restart: unless-stopped


  api:
    build:
      context: .
      dockerfile: Dockerfile.hw08
    container_name: s9981-api
    command: uvicorn hw08_api:app --host 0.0.0.0 --port 8081
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    depends_on:
      - kafka
      - worker
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: s9981-redis
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped

volumes:
  kafka-data:

